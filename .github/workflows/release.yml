name: Release theme

# Push a tag equal to manifest.json "version" (e.g. 26.10.0). The job checks
# the theme, attests where theme.css and manifest.json came from, and opens a
# draft release with both files attached. Publishing the draft is manual.

on:
  push:
    tags:
      - "*"

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Structural and accessibility checks
        run: node scripts/validate-theme.mjs

      - name: Palette checks
        run: |
          node scripts/palette.mjs check
          node scripts/build-palette.mjs --check

      - name: manifest.json version matches the tag
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version=$(node -p "require('./manifest.json').version")
          if [ "$tag" != "$version" ]; then
            echo "tag $tag does not match manifest version $version" >&2
            exit 1
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            theme.css
            manifest.json

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" --draft --title "$tag" --generate-notes \
            theme.css manifest.json
