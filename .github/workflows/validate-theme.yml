name: Validate theme

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # scripts/obsidian-api.json is a local artifact produced from an
      # installed Obsidian, so the checks that compare against the app's own
      # variables and classes are skipped here and reported as warnings. Run
      # the same command locally before a release to get the full set.
      - name: Structural and accessibility checks
        run: node scripts/validate-theme.mjs

      - name: Palette rules (scales, contrast)
        run: node scripts/palette.mjs check

      - name: Palette block up to date, no colours outside the palette
        run: node scripts/build-palette.mjs --check

      - name: Theme files present
        run: |
          test -f theme.css
          test -f manifest.json
          test -f versions.json
          test -f screenshot.png
