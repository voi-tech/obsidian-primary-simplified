name: Validate theme

on:
  push:
    branches: [master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # scripts/obsidian-api.json is a local artifact produced from an
      # installed Obsidian, so the checks that compare against the app's own
      # variables and classes are skipped here and reported as warnings. Run
      # the same command locally before a release to get the full set.
      - name: Structural and accessibility checks
        run: node scripts/validate-theme.mjs

      - name: Theme files present
        run: |
          test -f theme.css
          test -f manifest.json
          test -f versions.json
          test -f screenshot.png
